# L-02 (handoff/02-repair.md): CI for every PR and pushes to main.
# Agents never write to main directly; this workflow only verifies PRs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
