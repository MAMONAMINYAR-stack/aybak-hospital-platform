# L-02 (handoff/02-repair.md): CI for every PR and pushes to main.
# Agents never write to main directly; this workflow only verifies PRs.
# Repo policy: all actions must be pinned to a full-length commit SHA.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
